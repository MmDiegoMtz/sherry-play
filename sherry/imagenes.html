<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1620">
  <title>Recuerdos</title>
  <link rel="stylesheet" href="css/imagenes.css">
</head>
<body>

  <!-- Pantalla de juego -->
  <main id="juego">
    <header id="cabecera">
      <a class="icono" href="index.html" aria-label="Salir al inicio"><span class="material-symbols-outlined">arrow_back</span></a>
      <div id="progreso" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="progreso-texto"></div>
        <div id="progreso-pista"><div id="progreso-barra"></div></div>
      </div>
      <button id="btn-musica" class="icono" type="button" aria-label="Silenciar música"><span class="material-symbols-outlined">music_note</span></button>
      <button id="btn-pantalla" class="icono" type="button" aria-label="Pantalla completa" hidden><span class="material-symbols-outlined">fullscreen</span></button>
    </header>

    <div id="cuerpo">
      <div id="escenario">
        <div id="tablero" aria-label="Rompecabezas"></div>
        <div id="estado-carga" hidden>
          <p id="carga-texto">Revelando el recuerdo</p>
          <button id="btn-reintentar" class="texto" type="button" hidden><span class="material-symbols-outlined">refresh</span>Intentar de nuevo</button>
          <button id="btn-saltar" class="texto" type="button" hidden>Saltar esta fotografía</button>
        </div>
      </div>

      <footer id="pie">
        <p id="frase" aria-live="polite"></p>
        <button id="btn-siguiente" class="texto" type="button" hidden>Siguiente recuerdo<span class="material-symbols-outlined">arrow_forward</span></button>
      </footer>
    </div>
  </main>

  <!-- Pantalla final -->
  <section id="final" hidden>
    <p id="final-frase">Entre cada pieza fuimos encontrando un instante, y al unirlos todos descubriste lo que ninguna fotografía puede guardar sola: que nuestra historia sigue en movimiento, y todavía nos quedan muchos recuerdos por armar juntos.</p>
    <div id="final-acciones">
      <a class="texto" href="index.html">Volver a bosque</a>
      <button id="btn-reiniciar" class="texto" type="button">Empezar de nuevo</button>
    </div>
  </section>

  <script src="js/imagenes.js"></script>
</body>
</html>
